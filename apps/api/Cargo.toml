[package]
name = "modfolio-api"
# The release version lives in the root package.json and is injected by build.rs.
version = "0.0.0"
description = "Embeddable cards and badges for Modrinth, CurseForge, Hangar and Spigot content."
authors = ["Creeperkatze"]
license = "AGPL-3.0-only"
homepage = "https://modfolio.creeperkatze.dev"
repository = "https://github.com/creeperkatze/modfolio"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
image = { version = "0.25", default-features = false, features = [
	"png",
	"jpeg",
	"gif",
	"webp",
	"bmp",
	"ico",
	"tiff",
] }
moka = { version = "0.12", features = ["sync"] }
prometheus = { version = "0.14", features = ["process"] }
quick-xml = { version = "0.42", default-features = false }
reqwest = { version = "0.13", features = ["json", "query"] }
resvg = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
textwrap = { version = "0.16", default-features = false, features = ["std"] }
timeago = { version = "0.6", default-features = false, features = ["chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
bool_to_int_with_if = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
manual_assert = "warn"
manual_let_else = "warn"
match_bool = "warn"
needless_collect = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
todo = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
